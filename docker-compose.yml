name: dondee

services:
  # =========================================================================
  # 1. Base de Datos: PostgreSQL 16 con PostGIS 3.4
  # =========================================================================
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: dondee_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dondee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dondee_db"]
      interval: 4s
      timeout: 4s
      retries: 6

  # =========================================================================
  # 2. Backend: Node.js Express + TypeScript
  # =========================================================================
  backend:
    build:
      context: "./DondeE - BE"
      dockerfile: Dockerfile
    container_name: dondee_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: dondee_db
      PGUSER: postgres
      PGPASSWORD: postgres
    ports:
      - "3001:3001"

  # =========================================================================
  # 3. Frontend: React + Vite servido en Nginx de producción con proxy a API
  # =========================================================================
  frontend:
    build:
      context: "./DondeE - FE"
      dockerfile: Dockerfile
    container_name: dondee_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
